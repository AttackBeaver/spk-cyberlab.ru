services:
  postgres:
    image: postgres:15-alpine
    container_name: spk-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prisma123
      POSTGRES_DB: spk_cyberlab
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: spk-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:prisma123@postgres:5432/spk_cyberlab
    depends_on:
      - postgres

volumes:
  postgres_data: